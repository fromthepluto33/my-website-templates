<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шаблоны сайтов</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 30px;
      background: #1c1c1c;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #bbb;
      line-height: 1.5;
    }

    a {
      display: block;
      margin: 12px 0;
      padding: 14px 16px;
      background: #2a2a2a;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.2s;
    }

    a:hover {
      background: #3d3d3d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Демо-шаблоны сайтов</h1>
    <p>
      Шаблоны созданы с помощью нейросети в качестве демонстрации.
      Выберите нужный вариант:
    </p>

    <a href="sushi-bar-red/" target="_blank">Суши-бар — Красная тема</a>
    <a href="sushi-bar-gold/" target="_blank">Суши-бар — Золотая тема</a>
    <a href="cake-shop/" target="_blank">Кондитерская</a>
  </div>
</body>
</html>
